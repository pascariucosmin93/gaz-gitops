namespace: gaz

# ---------------------------------------------------------------------------
# Network Policies - restrict traffic between pods
# ---------------------------------------------------------------------------
networkPolicies:
  enabled: true

# ---------------------------------------------------------------------------
# Cilium Gateway API - direct routing for stateless microservices
# ---------------------------------------------------------------------------
gateway:
  enabled: true
  ip: "10.30.10.8"

# ---------------------------------------------------------------------------
# calculatorgaz - main Next.js application
# ---------------------------------------------------------------------------
promotedAt: "2026-03-10T19:04:49Z"

calculatorgaz:
  image:
    repository: ghcr.io/pascariucosmin93/gaz
    tag: "0.0.26"
    pullPolicy: Always

  # Imaginea migrator (Prisma migrate deploy) rulează ca Job Argo CD PreSync
  # înaintea fiecărui rollout; tag-ul se actualizează odată cu cel al aplicației.
  migrator:
    enabled: true
    tag: "migrator-0.0.26"

  imagePullSecrets: []

  replicaCount: 1

  service:
    type: LoadBalancer
    port: 80
    targetPort: 3000
    labels:
      cilium.io/lb-pool: pool-2
      cilium.io/bgp-advertise: "true"

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "384Mi"

  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 85
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 30
        policies:
          - type: Percent
            value: 100
            periodSeconds: 30
      scaleDown:
        stabilizationWindowSeconds: 120
        policies:
          - type: Percent
            value: 50
            periodSeconds: 60

  initContainer:
    image: postgres:16-alpine

  env:
    HOSTNAME: "0.0.0.0"
    RESET_PASSWORD_BASE_URL: "https://reset.gaz.cosmin-lab.cloud/"
    BILLING_SERVICE_URL: "http://billing-service:8080"
    REPORTING_SERVICE_URL: "http://reporting-service:8081"
    NOTIFICATION_SERVICE_URL: "http://notification-service:8082"
    AUTH_SERVICE_URL: "http://auth-service:8083"
    READING_SERVICE_URL: "http://reading-service:8084"
    METRICS_SERVICE_URL: "http://admin-metrics-service:8089"
    INVOICE_SERVICE_URL: "http://invoice-service:8087"
    SESSION_SERVICE_URL: "http://session-service:8088"
    APP_PUBLIC_URL: "https://reset.gaz.cosmin-lab.cloud"
    MAIL_FROM: "Cosmin Lab <noreply@cosmin-lab.com>"
    SMTP_HOST: "smtp-relay.brevo.com"
    SMTP_PORT: "587"
    R2_ENDPOINT: "https://s3.galeata.devjobs.ro"
    R2_REGION: "us-east-1"
    R2_BUCKET: "facturi"
    ADMIN_EMAIL: "admin@gmail.com"
    NEXT_PUBLIC_ADMIN_EMAIL: "admin@gmail.com"

  secretName: calculatorgaz-secrets
  secretEnv:
    - envKey: DATABASE_URL
      secretKey: DATABASE_URL
    - envKey: DISCORD_RESET_WEBHOOK_URL
      secretKey: DISCORD_RESET_WEBHOOK_URL
    # Cheile S3 (SeaweedFS) rămân în Secret sub numele vechi; aplicația le citește ca R2_*.
    - envKey: R2_ACCESS_KEY
      secretKey: SEAWEED_S3_ACCESS_KEY
    - envKey: R2_SECRET_KEY
      secretKey: SEAWEED_S3_SECRET_KEY
    - envKey: SMTP_USER
      secretKey: SMTP_USER
    - envKey: SMTP_PASSWORD
      secretKey: SMTP_PASSWORD
    - envKey: JWT_SECRET
      secretKey: JWT_SECRET
    - envKey: INTERNAL_API_KEY
      secretKey: INTERNAL_API_KEY
    - envKey: ADMIN_PASSWORD
      secretKey: ADMIN_PASSWORD
    - envKey: ADMIN_SESSION_SECRET
      secretKey: ADMIN_SESSION_SECRET

  initSecretEnv:
    - envKey: PGPASSWORD
      secretKey: POSTGRES_PASSWORD
    - envKey: POSTGRES_USER
      secretKey: POSTGRES_USER

  probes:
    readiness:
      path: /api/health
      port: 3000
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 5
    liveness:
      path: /api/health
      port: 3000
      initialDelaySeconds: 40
      periodSeconds: 15
      timeoutSeconds: 5

# ---------------------------------------------------------------------------
# Microservices - ConfigMap-based Node.js services
# ---------------------------------------------------------------------------
microservices:

  auth-service:
    enabled: true
    scriptFile: auth-service.mjs
    port: 8083
    env:
      PORT: "8083"
      APP_BASE_URL: "http://calculatorgaz"
    secretName: calculatorgaz-secrets
    secretEnv:
      - envKey: INTERNAL_API_KEY
        secretKey: INTERNAL_API_KEY
    resources:
      requests:
        cpu: "20m"
        memory: "32Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
  billing-service:
    enabled: true
    scriptFile: billing-service.js
    port: 8080
    gatewayExposed: true
    env:
      PORT: "8080"
    secretName: ""
    secretEnv: []
    resources:
      requests:
        cpu: "20m"
        memory: "32Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
  reading-service:
    enabled: true
    scriptFile: reading-service.js
    port: 8084
    allowedClients:
      - reporting-service
    env:
      PORT: "8084"
      APP_BASE_URL: "http://calculatorgaz"
    secretName: calculatorgaz-secrets
    secretEnv:
      - envKey: INTERNAL_API_KEY
        secretKey: INTERNAL_API_KEY
    resources:
      requests:
        cpu: "20m"
        memory: "32Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
  reporting-service:
    enabled: true
    scriptFile: reporting-service.js
    port: 8081
    gatewayExposed: true
    env:
      PORT: "8081"
      READING_SERVICE_URL: "http://reading-service:8084"
    secretName: ""
    secretEnv: []
    resources:
      requests:
        cpu: "20m"
        memory: "32Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
  notification-service:
    enabled: true
    scriptFile: notification-service.js
    port: 8082
    env:
      PORT: "8082"
      APP_BASE_URL: "http://calculatorgaz"
    secretFiles:
      - envKey: INTERNAL_API_KEY_FILE
        secretKey: INTERNAL_API_KEY
    secretName: notification-service-secrets
    secretEnv:
      - envKey: DISCORD_WEBHOOK_URL
        secretKey: DISCORD_WEBHOOK_URL
    resources:
      requests:
        cpu: "20m"
        memory: "32Mi"
      limits:
        cpu: "150m"
        memory: "96Mi"
  invoice-service:
    enabled: true
    scriptFile: invoice-service.js
    port: 8087
    env:
      PORT: "8087"
      APP_BASE_URL: "http://calculatorgaz"
    secretName: calculatorgaz-secrets
    secretEnv:
      - envKey: INTERNAL_API_KEY
        secretKey: INTERNAL_API_KEY
    resources:
      requests:
        cpu: "20m"
        memory: "32Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
  session-service:
    enabled: true
    scriptFile: session-service.mjs
    port: 8088
    env:
      PORT: "8088"
    secretName: calculatorgaz-secrets
    secretEnv:
      - envKey: JWT_SECRET
        secretKey: JWT_SECRET
    resources:
      requests:
        cpu: "20m"
        memory: "32Mi"
      limits:
        cpu: "150m"
        memory: "96Mi"
  admin-metrics-service:
    enabled: true
    scriptFile: admin-metrics-service.js
    port: 8089
    env:
      PORT: "8089"
      APP_BASE_URL: "http://calculatorgaz"
    secretName: calculatorgaz-secrets
    secretFiles:
      - envKey: INTERNAL_API_KEY_FILE
        secretKey: INTERNAL_API_KEY
    resources:
      requests:
        cpu: "20m"
        memory: "32Mi"
      limits:
        cpu: "150m"
        memory: "96Mi"
