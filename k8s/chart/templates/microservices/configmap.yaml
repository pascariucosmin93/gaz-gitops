{{- range $name, $svc := .Values.microservices }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-script
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "gaz.labels" $ | nindent 4 }}
    {{- include "gaz.selectorLabels" $name | nindent 4 }}
data:
  {{ $svc.scriptFile }}: |
{{ $.Files.Get (printf "scripts/%s" $svc.scriptFile) | indent 4 }}
{{- end }}
{{- end }}
