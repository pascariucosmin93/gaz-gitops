{{- if (index .Values.microservices "notification-service").enabled }}
{{- $svc := index .Values.microservices "notification-service" }}
# Secretul propriu al notification-service, populat din Vault (kv/prod/gaz/gaz-secrets).
# Discord: se folosește același webhook ca la calculatorgaz.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $svc.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "gaz.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: {{ $svc.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: INTERNAL_API_KEY
      remoteRef:
        key: prod/gaz/gaz-secrets
        property: internal_api_key
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: prod/gaz/gaz-secrets
        property: discord_reset_webhook_url_v2
{{- end }}
