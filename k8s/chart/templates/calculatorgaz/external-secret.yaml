# Secretele aplicației vin din Vault (kv/prod/gaz/gaz-secrets) prin External Secrets.
# Migrarea Prisma e hook PreSync și are nevoie de secret, deci ExternalSecret-ul
# rulează tot în PreSync, într-un wave mai devreme. Orphan: secretul nu e șters
# împreună cu hook-ul la următorul sync.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.calculatorgaz.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "gaz.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: {{ .Values.calculatorgaz.secretName }}
    creationPolicy: Orphan
  dataFrom:
    - extract:
        key: prod/gaz/gaz-secrets
