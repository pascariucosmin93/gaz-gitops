# Secretele aplicației vin din Vault (kv/prod/gaz/gaz-secrets) prin External Secrets.
# Migrarea Prisma e hook PreSync și are nevoie de secret, deci ExternalSecret-ul
# rulează tot în PreSync, într-un wave mai devreme. Orphan: secretul nu e șters
# împreună cu hook-ul la următorul sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.calculatorgaz.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "gaz.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: {{ .Values.calculatorgaz.secretName }}
    creationPolicy: Orphan
  # Numele din Vault diferă de cele din chart, de aceea maparea e explicită.
  # POSTGRES_USER / POSTGRES_PASSWORD (initSecretEnv) nu există încă în Vault.
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: prod/gaz/gaz-secrets
        property: database_url
    - secretKey: DISCORD_RESET_WEBHOOK_URL
      remoteRef:
        key: prod/gaz/gaz-secrets
        property: discord_reset_webhook_url_v2
    - secretKey: SEAWEED_S3_ACCESS_KEY
      remoteRef:
        key: prod/gaz/gaz-secrets
        property: r2_access_key
    - secretKey: SEAWEED_S3_SECRET_KEY
      remoteRef:
        key: prod/gaz/gaz-secrets
        property: r2_secret_key
    - secretKey: SMTP_USER
      remoteRef:
        key: prod/gaz/gaz-secrets
        property: smtp_user
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: prod/gaz/gaz-secrets
        property: smtp_key
    - secretKey: JWT_SECRET
      remoteRef:
        key: prod/gaz/gaz-secrets
        property: session_jwt_secret
    - secretKey: INTERNAL_API_KEY
      remoteRef:
        key: prod/gaz/gaz-secrets
        property: internal_api_key
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: prod/gaz/gaz-secrets
        property: admin_password_minimouse
    - secretKey: ADMIN_SESSION_SECRET
      remoteRef:
        key: prod/gaz/gaz-secrets
        property: admin_session_secret
